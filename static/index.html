<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JarVis · Trợ lý kho</title><link rel="stylesheet" href="/static/style.css"><script src="/static/jarvis.js" defer></script><script src="/static/i18n.js" defer></script><script src="/static/app.js" defer></script><script src="/static/voice.js" defer></script><script src="/static/mic-check.js" defer></script></head>
<body><header><span>JarVis / WAREHOUSE AI</span><span id="mode" data-i18n="connecting"></span></header>
<main><h1 data-i18n="heroTitle"></h1><p data-i18n="heroSubtitle"></p>
<section class="settings"><label><span data-i18n="accessLabel"></span><input id="token" type="password" autocomplete="off" data-i18n-placeholder="tokenPlaceholder"></label><label><span data-i18n="languageLabel"></span><select id="language"><option value="en">English</option><option value="zh">中文</option><option value="vi" selected>Tiếng Việt</option></select></label></section>
<div class="layout"><aside><div id="assistant" data-state="idle"><div class="jarvis-stage" aria-hidden="true"><div class="jarvis-frame welcome"></div><div class="jarvis-frame fault"></div><div class="jarvis-frame thinking"></div><div class="jarvis-frame result"></div><div class="jarvis-glow"></div></div><h2 data-i18n="greeting"></h2><p id="assistant-state" role="status"></p></div><p data-i18n="intro"></p><button class="secondary" id="example" data-i18n="exampleShortage"></button><p class="muted" data-i18n="disclaimer"></p><label class="check"><input id="auto-read" type="checkbox"> <span data-i18n="autoReadLabel"></span></label><p class="muted" data-i18n="autoReadHelp"></p><div class="buttons"><button id="read" class="secondary" disabled data-i18n="readAnswer"></button><button id="stop-speech" class="secondary" disabled data-i18n="stopReading"></button></div><p id="speech-status" class="muted" role="status"></p></aside>
<section class="conversation"><div class="conversation-heading"><h2 data-i18n="conversation"></h2><button id="new" class="secondary" data-i18n="newSession"></button></div><div id="chat" role="log" aria-live="polite"><p data-i18n="chatEmpty"></p></div><div id="proposal"></div><details><summary data-i18n="sourcesSummary"></summary><div id="sources"></div></details><label for="question" data-i18n="questionLabel"></label><textarea id="question" rows="3" maxlength="2000" data-i18n-placeholder="questionPlaceholder"></textarea><div class="buttons"><button id="send" data-i18n="send"></button><button id="mic" class="secondary" aria-pressed="false"></button><button id="retry" class="secondary" disabled data-i18n="retry"></button></div><button id="mic-test" class="secondary"></button><meter id="mic-level" min="0" max="1" value="0" data-i18n-aria-label="micLevel"></meter><p id="mic-diagnostic" role="status" class="muted"></p><p id="voice-original" class="muted"></p><p id="voice-status" role="status" class="muted"></p><p class="muted" data-i18n="voicePrivacy"></p><details><summary data-i18n="edgeTitle"></summary><p data-i18n="edgeHelpSignal"></p><p data-i18n="edgeHelpNetwork"></p><p data-i18n="edgeHelpDevice"></p></details><p id="status" role="status" data-i18n="ready"></p></section></div>
<details class="advanced"><summary data-i18n="advanced"></summary><div class="settings"><label><span data-i18n="localeLabel"></span><input id="locale" data-i18n-placeholder="localePlaceholder"></label><label><span data-i18n="taskLabel"></span><select id="task"><option>TEST-PICK-001</option><option>TEST-PUT-001</option><option>TEST-COUNT-001</option></select></label><label><span data-i18n="eventLabel"></span><select id="event"><option value="user_question" data-i18n="eventQuestion"></option><option value="scan_success" data-i18n="eventScanSuccess"></option><option value="scan_failure" data-i18n="eventScanFailure"></option><option value="shelf_mismatch" data-i18n="eventShelfMismatch"></option><option value="route_deviation" data-i18n="eventRouteDeviation"></option><option value="task_completion" data-i18n="eventCompletion"></option><option value="summary_request" data-i18n="eventSummary"></option></select></label></div><p id="session" data-i18n="noSession"></p><pre id="request" data-i18n="tokenHidden"></pre></details>
<footer data-i18n="footer"></footer></main></body></html>
